<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 01: Trang thơ "Bốn mùa"</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <article class="khung-tho">
    <h1><b>BỐN MÙA</b></h1>
    <p class="khoxanh"> 
        Xuân về hoa nở khắp trời<br>
        Hạ sang nắng cháy rạng ngời phố quen <br> 
        Thu về lá rụng bên thềm <hr>
    </p>
    <p class="khodo">
        Đông sang gió lạnh bên em đợi chờ <br>
        Bốn mùa là bốn giấc mơ <br>
        Thời gian đi mãi ta chờ đợi ai <hr>
    </p>
    <p class="khoxanh">
        Một năm rồi lại một năm <br>
        Vẫn còn câu hát thì thầm quê hương <br>
        Chờ xuân nắng mới soi đường
    </p>
    </article>
</body>
</html>
